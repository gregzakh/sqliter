sqlet:
    meta:
        description: >
            Checks whether two words are anagram. Both strings are assumed
            to be lowercase.
        tags: [words, anagram]
    scripts:
        - engine: pg
          script: |
            do $$
            declare
               a1 text := 'listen';
               a2 text := 'silent';
            begin
               raise notice '%', (length(a1) = length(a2) and (
                  select not exists (
                     select unnest(string_to_array(a1, null))
                     except all
                     select unnest(string_to_array(a2, null))
                  )
               ));
            end $$;

        - engine: sqlite
          script: |
            select length('listen') = length('silent')
               and (
                  with chars as (
                     select substr('listen', value, 1) w1,
                            substr('silent', value, 1) w2
                     from generate_series(1, length('listen'))
                  )
                  select group_concat(w1, '' order by w1) =
                         group_concat(w2, '' order by w2)
                  from chars
               );
