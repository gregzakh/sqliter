sqlet:
    meta:
        description: >
            Checks whether a phrase is a palindrome, ignoring case and
            non-letter characters.
        tags: [text, palindrome]
    scripts:
        - engine: pg
          script: |
            do $$
            declare
                phrase text := 'Madam, I''m Adam';
            begin
                phrase = lower(regexp_replace(phrase, '[^a-z]+', '', 'ig'));
                raise notice '%', reverse(phrase) = phrase;
            end $$;

        - engine: my
          script: |
            set @phrase = "Madam, I'm Adam";
            set @purified = lower(regexp_replace(@phrase, '[^a-z]', ''));
            select reverse(@purified) = @purified;

        - engine: ms
          remark: 2022
          script: |
            declare @str varchar(15) = 'Madam, I''m Adam';

            with chars(i, c) as (
                select value, lower(substring(@str, value, 1))
                from generate_series(1, len(@str))
            )
            select iif(string_agg(c, '') within group (order by i desc) =
                       string_agg(c, ''), 1, 0
            )
            from chars
            where c like '[a-z]';

        - engine: ora
          remark: v21
          script: |
            declare
                str varchar2(15) := 'Madam, I''m Adam';
                res varchar2(15);
            begin
                str := regexp_replace(lower(str), '[^a-z]+', '');
                select listagg(substr(str, level, 1), '')
                       within group (order by level desc)
                into res
                from dual
                connect by level <= length(str);
                dbms_output.put_line(case when str = res then 1 else 0 end);
            end;

        - engine: sqlite
          script: |
            .param set $phrase "Madam, I'm Adam"

            with chars(i, c) as (
                select value, lower(substr($phrase, value, 1))
                from generate_series(1, length($phrase))
            )
            select group_concat(c, '' order by i desc) =
                   group_concat(c, '')
            from chars
            where c glob '[a-z]';

        - engine: db2
          script: |
            with t(txt) as (
                values regexp_replace(lower('Madam, I''m Adam'), '[^a-z]', '')
            )
            select min(substr(txt, num, 1) = substr(txt, length(txt) - num + 1, 1))
            from t, (
                select row_number() over() from syscat.tables
            ) as t(num)
            where num <= length(txt);

        - engine: fdb
          script: |
            with
            v(txt) as (
                select lower('Madam, I''m Adam')
                from rdb$database
            ),
            t(a, b) as (
                select substring(txt from num for 1) a,
                       substring(txt from char_length(txt) - num + 1 for 1) b
                from v, (
                    select row_number() over() num
                    from rdb$relation_fields
                    rows (select char_length(txt) from v)
                )
            )
            select min(a = b)
            from t
            where a similar to '[a-z]'
              and b similar to '[a-z]';
