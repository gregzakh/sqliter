sqlet:
    meta:
        description: >
            Generate a secure-looking random password by shuffling printable ASCII
            characters and returning the first 13 characters.
        tags: [password, random]
    scripts:
        - engine: pg
          script: |
            select left(string_agg(chr(v), '' order by random()), 13)
            from generate_series(33, 122) v;

        - engine: my
          script: |
            select left(group_concat(char(33 + rand() * 90) separator ''), 13)
            from information_schema.statistics;

        - engine: ms
          script: |
            select left(string_agg(char(value), '') within group (order by newid()), 13)
            from generate_series(33, 122);

        - engine: ora
          script: |
            select substr(replace(dbms_random.string('p', 90), ' ', ''), 1, 13)
            from dual;

        - engine: sqlite
          script: |
            select substr(group_concat(char(value), '' order by random()), 1, 13)
            from generate_series(33, 122);

        - engine: db2
          script: |
            select left(listagg(
                chr(33 + cast(rand() * 90 as integer)), ''
            ) within group (order by rand()), 13)
            from syscat.tables;

        - engine: fdb
          script: |
            select left(list(
                ascii_char(33 + cast(rand() * 90 as integer)), ''
            ), 13)
            from rdb$relation_fields;
